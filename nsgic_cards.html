
<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<title>NSGIC Cards</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f8f8f8;
  }

  .cards-wrapper {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }

  .three-card img {
    width: 100%;
    height: auto;
    display: block;
  }

  .three-card {
    width: 100%;
  }
</style>
</head>
<body>

<div class="cards-wrapper">

  <!-- CARD 1 - NGC -->
  <div class="three-card contrast-safe-text">
    <calcite-card style="--calcite-color-foreground-1:white" scale="m" thumbnail-position="block-start">

      <div slot="thumbnail">
        <a href="https://nsgic.org/wp-content/uploads/2025/05/NGC_Logo_FINAL-COLOR.png" target="_blank" rel="noopener noreferrer">
          <img src="https://nsgic.org/wp-content/uploads/2025/05/NGC_Logo_FINAL-COLOR.png" alt="NGC logo">
        </a>
      </div>

      <div class="card-content">
        <h4 slot="heading">
          <a href="https://nsgic.hub.arcgis.com/pages/163dec181ec24a5ba58cdf0ef3e1ca04" target="_blank" rel="noopener noreferrer">
            NGC
          </a>
        </h4>

        <div slot="footer-end" class="btn-group btn-group-justified">
        </div>
      </div>

    </calcite-card>
  </div>


  <!-- CARD 2 - CLC -->
  <div class="three-card contrast-safe-text">
    <calcite-card style="--calcite-color-foreground-1:white" scale="m" thumbnail-position="block-start">

      <div slot="thumbnail">
        <a href="https://nsgic.org/wp-content/uploads/2024/11/NSDI-Podcast-Cover-YT.png" target="_blank" rel="noopener noreferrer">
          <img src="https://nsgic.org/wp-content/uploads/2024/11/NSDI-Podcast-Cover-YT.png" alt="CLC logo">
        </a>
      </div>

      <div class="card-content">
        <h4 slot="heading">
          <a href="https://nsgic.hub.arcgis.com/pages/3bf3b4ee6f3446eb84fb3cd2a349691b" target="_blank" rel="noopener noreferrer">
            CLC
          </a>
        </h4>

        <div slot="footer-end" class="btn-group btn-group-justified">
        </div>
      </div>

    </calcite-card>
  </div>


  <!-- CARD 3 - Advocacy -->
  <div class="three-card contrast-safe-text">
    <calcite-card style="--calcite-color-foreground-1:white" scale="m" thumbnail-position="block-start">

      <div slot="thumbnail">
        <a href="https://www.nps.gov/common/uploads/cropped_image/primary/071B8BD5-B733-1E72-03FEDAF1516CB194.jpg?width=1600&quality=90&mode=crop" target="_blank" rel="noopener noreferrer">
          <img src="https://www.nps.gov/common/uploads/cropped_image/primary/071B8BD5-B733-1E72-03FEDAF1516CB194.jpg?width=1600&quality=90&mode=crop" alt="Advocacy image">
        </a>
      </div>

      <div class="card-content">
        <h4 slot="heading">
          <a href="https://experience.arcgis.com/experience/c883c8742ba243a18ec390ab2f9ea7b3" target="_blank" rel="noopener noreferrer">
            Advocacy
          </a>
        </h4>

        <div slot="footer-end" class="btn-group btn-group-justified">
        </div>
      </div>

    </calcite-card>
  </div>


  <!-- CARD 4 - GMA -->
  <div class="three-card contrast-safe-text">
    <calcite-card style="--calcite-color-foreground-1:white" scale="m" thumbnail-position="block-start">

      <div slot="thumbnail">
        <a href="https://nsgic.org/wp-content/uploads/2023/02/GMAUndatedLogoGold.png" target="_blank" rel="noopener noreferrer">
          <img src="https://nsgic.org/wp-content/uploads/2023/02/GMAUndatedLogoGold.png" alt="GMA logo">
        </a>
      </div>

      <div class="card-content">
        <h4 slot="heading">
          <a href="https://experience.arcgis.com/experience/31eef3abb781476fb354321f4213f892" target="_blank" rel="noopener noreferrer">
            GMA
          </a>
        </h4>

        <div slot="footer-end" class="btn-group btn-group-justified">
        </div>
      </div>

    </calcite-card>
  </div>

 <!-- CARD 5 - States -->
  <div class="three-card contrast-safe-text">
    <calcite-card style="--calcite-color-foreground-1:white" scale="m" thumbnail-position="block-start">

      <div slot="thumbnail">
        <a href="https://nsgic.maps.arcgis.com/sharing/rest/content/items/5e782b4b1ef547c099843a5c63b27ad5/data" target="_blank" rel="noopener noreferrer">
          <img src="https://nsgic.maps.arcgis.com/sharing/rest/content/items/5e782b4b1ef547c099843a5c63b27ad5/data" alt="USA">
        </a>
      </div>

      <div class="card-content">
        <h4 slot="heading">
          <a href="https://experience.arcgis.com/experience/61e52b012f804122991139f2211cdd40" target="_blank" rel="noopener noreferrer">
            States
          </a>
        </h4>

        <div slot="footer-end" class="btn-group btn-group-justified">
        </div>
      </div>

    </calcite-card>
  </div>

</body>
</html>
